<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>n8n 노드 플래시카드 · 데이터팝콘</title>
<style>
:root {
  --bg: #f0f0ef;
  --card: #fff;
  --ink: #111;
  --mute: #555;
  --faint: #999;
  --accent: #ff6d5a;
  --radius: 16px;
  --font: -apple-system, "Pretendard Variable", Pretendard, BlinkMacSystemFont, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  background: var(--bg);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  min-height: 100vh; padding: 1rem;
  gap: 1rem;
}

/* ── Header ── */
.top-bar {
  width: 100%; max-width: 520px;
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: .5rem;
}
.top-bar h1 { font-size: 1rem; font-weight: 800; color: var(--ink); }
.top-bar h1 span { color: var(--accent); }
.progress-text { font-size: .82rem; color: var(--mute); font-weight: 600; }

/* ── Category filter ── */
.cat-bar {
  display: flex; flex-wrap: wrap; gap: 6px;
  width: 100%; max-width: 520px;
}
.cat-btn {
  font-size: .72rem; font-weight: 700; padding: .25em .7em;
  border-radius: 99px; border: 1.5px solid #ddd;
  background: #fff; color: var(--mute);
  cursor: pointer; transition: all .15s;
}
.cat-btn.active { color: #fff; border-color: transparent; }
.cat-btn[data-cat="all"].active    { background: var(--accent); }
.cat-btn[data-cat="trigger"].active { background: #FF6D5A; }
.cat-btn[data-cat="data"].active    { background: #6366F1; }
.cat-btn[data-cat="flow"].active    { background: #F59E0B; }
.cat-btn[data-cat="wf"].active      { background: #7C3AED; }
.cat-btn[data-cat="ai"].active      { background: #10B981; }
.cat-btn[data-cat="app"].active     { background: #6B7280; }

/* ── Flashcard ── */
.card-wrapper {
  width: 100%; max-width: 420px;
  perspective: 1200px;
  cursor: pointer;
  user-select: none;
}
.card-inner {
  position: relative;
  width: 100%; height: 280px;
  transform-style: preserve-3d;
  transition: transform .45s cubic-bezier(.4,0,.2,1);
  border-radius: var(--radius);
}
.card-wrapper.flipped .card-inner { transform: rotateY(180deg); }

.card-face {
  position: absolute; inset: 0;
  backface-visibility: hidden;
  border-radius: var(--radius);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 2rem;
  box-shadow: 0 8px 32px rgba(0,0,0,0.13);
}
.card-front {
  background: var(--card);
  border-top: 6px solid var(--cat-color, #ccc);
}
.card-back {
  background: var(--card);
  transform: rotateY(180deg);
  align-items: flex-start; justify-content: flex-start;
  border-top: 6px solid var(--cat-color, #ccc);
  gap: .6rem;
}

/* Front */
.card-icon-wrap {
  width: 72px; height: 72px;
  border-radius: 18px;
  background: #f5f5f5;
  border: 2px solid rgba(0,0,0,0.07);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: .75rem;
}
.card-icon-wrap svg { width: 36px; height: 36px; }
.card-icon-wrap img { width: 40px; height: 40px; object-fit: contain; }
.card-front-name {
  font-size: 1.35rem; font-weight: 800; color: var(--ink);
  text-align: center; line-height: 1.2;
}
.card-front-badge {
  font-size: .72rem; font-weight: 700;
  padding: .2em .65em; border-radius: 99px;
  margin-top: .4rem;
}
.card-hint {
  position: absolute; bottom: 1rem; left: 0; right: 0;
  text-align: center; font-size: .7rem; color: var(--faint);
}

/* Back */
.card-back-header { display: flex; align-items: center; gap: .75rem; width: 100%; }
.card-back-icon-wrap {
  width: 44px; height: 44px; min-width: 44px;
  border-radius: 12px; background: #f5f5f5;
  border: 1.5px solid rgba(0,0,0,0.07);
  display: flex; align-items: center; justify-content: center;
}
.card-back-icon-wrap svg { width: 22px; height: 22px; }
.card-back-icon-wrap img { width: 26px; height: 26px; object-fit: contain; }
.card-back-name { font-size: 1.05rem; font-weight: 800; color: var(--ink); }
.card-back-type { font-size: .72rem; color: var(--faint); font-family: ui-monospace, monospace; margin-top: .15rem; }
.card-divider { width: 100%; height: 1px; background: #eee; }
.card-back-desc { font-size: .88rem; color: var(--mute); line-height: 1.6; }
.card-back-tip {
  font-size: .8rem; color: #888;
  background: #f9f9f7; border-radius: 8px;
  padding: .5rem .75rem; line-height: 1.5;
  border-left: 3px solid var(--accent);
  width: 100%;
}

/* ── Nav ── */
.nav-bar {
  display: flex; align-items: center; gap: 1rem;
  width: 100%; max-width: 420px;
}
.nav-btn {
  width: 44px; height: 44px; border-radius: 50%;
  border: 2px solid #ddd; background: #fff;
  font-size: 1.1rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s; color: var(--ink); flex-shrink: 0;
}
.nav-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.nav-btn:disabled { opacity: .3; cursor: default; }
.progress-bar-wrap {
  flex: 1; height: 6px; background: #e0e0e0; border-radius: 99px; overflow: hidden;
}
.progress-bar { height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }

/* ── Keyboard hint ── */
.kbd-hint {
  font-size: .72rem; color: var(--faint); text-align: center;
}
.kbd-hint kbd {
  font-family: ui-monospace, monospace; font-size: .68rem;
  background: #fff; border: 1px solid #ddd; border-radius: 4px;
  padding: .1em .4em;
}
</style>
</head>
<body>

<div class="top-bar">
  <h1>n<span>8</span>n 핵심 노드 플래시카드</h1>
  <span class="progress-text" id="progress-text">1 / 24</span>
</div>

<div class="cat-bar" id="cat-bar">
  <button class="cat-btn active" data-cat="all">전체</button>
  <button class="cat-btn" data-cat="trigger">트리거</button>
  <button class="cat-btn" data-cat="data">데이터</button>
  <button class="cat-btn" data-cat="flow">흐름제어</button>
  <button class="cat-btn" data-cat="wf">워크플로우</button>
  <button class="cat-btn" data-cat="ai">AI</button>
  <button class="cat-btn" data-cat="app">앱 연동</button>
</div>

<div class="card-wrapper" id="card-wrapper" onclick="flipCard()">
  <div class="card-inner" id="card-inner">
    <div class="card-face card-front" id="card-front">
      <div class="card-icon-wrap" id="front-icon"></div>
      <div class="card-front-name" id="front-name"></div>
      <div class="card-front-badge" id="front-badge"></div>
      <div class="card-hint">탭하여 설명 보기 →</div>
    </div>
    <div class="card-face card-back" id="card-back">
      <div class="card-back-header">
        <div class="card-back-icon-wrap" id="back-icon"></div>
        <div>
          <div class="card-back-name" id="back-name"></div>
          <div class="card-back-type" id="back-type"></div>
        </div>
      </div>
      <div class="card-divider"></div>
      <div class="card-back-desc" id="back-desc"></div>
      <div class="card-back-tip" id="back-tip"></div>
    </div>
  </div>
</div>

<div class="nav-bar">
  <button class="nav-btn" id="btn-prev" onclick="navigate(-1)">←</button>
  <div class="progress-bar-wrap"><div class="progress-bar" id="progress-bar"></div></div>
  <button class="nav-btn" id="btn-next" onclick="navigate(1)">→</button>
</div>

<div class="kbd-hint">
  <kbd>←</kbd><kbd>→</kbd> 이동 &nbsp;|&nbsp; <kbd>Space</kbd> 뒤집기 &nbsp;|&nbsp; <kbd>1</kbd>–<kbd>6</kbd> 카테고리
</div>

const CAT_BADGE = {
  trigger: { label: '트리거',   bg: '#FEE2E2', color: '#DC2626' },
  data:    { label: '데이터',   bg: '#DBEAFE', color: '#1D4ED8' },
  flow:    { label: '흐름제어', bg: '#FEF3C7', color: '#D97706' },
  wf:      { label: '워크플로우', bg: '#EDE9FE', color: '#6D28D9' },
  ai:      { label: 'AI',      bg: '#D1FAE5', color: '#065F46' },
  app:     { label: '앱 연동', bg: '#F3F4F6', color: '#374151' },
};

let filtered = [...NODES];
let idx = 0;
let flipped = false;

function iconHtml(node, size = 'front') {
  const sz = size === 'front' ? 36 : 22;
  if (node.imgSrc) {
    return `<img src="${node.imgSrc}" style="width:${sz+4}px;height:${sz+4}px;object-fit:contain">`;
  }
  return node.icon.replace(/width="\d+"/, `width="${sz}"`).replace(/height="\d+"/, `height="${sz}"`);
}

function render() {
  if (!filtered.length) return;
  const node = filtered[idx];
  flipped = false;
  document.getElementById('card-wrapper').classList.remove('flipped');

  // colors
  document.getElementById('card-front').style.setProperty('--cat-color', node.catColor);
  document.getElementById('card-back').style.setProperty('--cat-color', node.catColor);

  // front
  const iconWrap = document.getElementById('front-icon');
  iconWrap.style.color = node.color;
  iconWrap.innerHTML = iconHtml(node, 'front');

  document.getElementById('front-name').textContent = node.name;
  const badge = document.getElementById('front-badge');
  const b = CAT_BADGE[node.cat];
  badge.textContent = b.label;
  badge.style.background = b.bg;
  badge.style.color = b.color;

  // back
  const backIcon = document.getElementById('back-icon');
  backIcon.style.color = node.color;
  backIcon.innerHTML = iconHtml(node, 'back');

  document.getElementById('back-name').textContent = node.name;
  document.getElementById('back-type').textContent = node.type;
  document.getElementById('back-desc').textContent = node.desc;
  document.getElementById('back-tip').textContent = '💡 ' + node.tip;

  // progress
  const total = filtered.length;
  document.getElementById('progress-text').textContent = `${idx + 1} / ${total}`;
  document.getElementById('progress-bar').style.width = `${((idx + 1) / total) * 100}%`;
  document.getElementById('btn-prev').disabled = idx === 0;
  document.getElementById('btn-next').disabled = idx === total - 1;
}

function flipCard() {
  flipped = !flipped;
  document.getElementById('card-wrapper').classList.toggle('flipped', flipped);
}

function navigate(dir) {
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= filtered.length) return;
  idx = newIdx;
  render();
}

function filterCat(cat) {
  filtered = cat === 'all' ? [...NODES] : NODES.filter(n => n.cat === cat);
  idx = 0;
  render();
  document.querySelectorAll('.cat-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.cat === cat);
  });
}

document.getElementById('cat-bar').addEventListener('click', e => {
  if (e.target.classList.contains('cat-btn')) filterCat(e.target.dataset.cat);
});

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') navigate(1);
  else if (e.key === 'ArrowLeft') navigate(-1);
  else if (e.key === ' ') { e.preventDefault(); flipCard(); }
  else if (e.key === '1') filterCat('trigger');
  else if (e.key === '2') filterCat('data');
  else if (e.key === '3') filterCat('flow');
  else if (e.key === '4') filterCat('wf');
  else if (e.key === '5') filterCat('ai');
  else if (e.key === '6') filterCat('app');
});

render();
</script>
